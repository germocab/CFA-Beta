<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="icon" href="favicon_io2/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io2/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon_io2/apple-touch-icon.png">
  <style>
/* --- CONFIGURACIÓN BASE --- */
:root {
  --bg-body: #f0f2f5; --bg-screen: #ffffff; --bg-card: #f8f9fa;
  --text-main: #1a1a1a; --text-gray: #65676b; --primary-orange: #f36100;
  --primary-blue: #0056ff; --primary-green: #28a745; --radius: 24px;
  --border-color: #e4e6eb; --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --glass-blur: blur(18px); --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-border: rgba(255, 255, 255, 0.35);
}

body.dark-mode {
  --bg-body: #1e1e1e; --bg-screen: #121212; --bg-card: #1e1e1e;
  --text-main: #ffffff; --text-gray: #a0a0a0; --border-color: rgba(255,255,255,0.05);
  --glass-bg: rgba(30, 30, 30, 0.55); --glass-border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; transition: background 0.3s; }

/* Fondo Gradiente Dinámico */
body {
  background: radial-gradient(1200px 600px at 10% -10%, rgba(243,97,0,0.10), transparent),
              radial-gradient(900px 500px at 90% 110%, rgba(0,86,255,0.10), transparent),
              var(--bg-body);
}

.app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; margin: auto; }

.screen { 
  background-color: var(--bg-screen); border-radius: var(--radius); overflow: hidden; 
  height: 850px; display: flex; flex-direction: column; box-shadow: var(--shadow); 
  border: 1px solid var(--border-color); position: relative;
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  background: var(--glass-bg); border: 1px solid var(--glass-border);
}

.scroll-container { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }

/* --- NUEVOS ESTILOS PARA LA IMAGEN DE CABECERA --- */
.location-banner-container {
  position: relative;
  width: 100%;
  height: 220px;
  overflow: hidden;
}

.location-banner-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s ease;
}

/* El degrade que hace la transición a la info inferior */
.location-banner-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background: linear-gradient(to bottom, transparent, var(--bg-screen));
}

body.dark-mode .location-banner-overlay {
  background: linear-gradient(to bottom, transparent, var(--bg-screen));
}

/* Botón atrás flotante sobre la imagen */
.back-btn-floated {
  position: absolute;
  top: 20px;
  left: 20px;
  z-index: 10;
  background: rgba(0,0,0,0.3) !important;
  backdrop-filter: blur(8px);
  color: white !important;
  border: none !important;
}

/* --- ESTILOS DE ELEMENTOS --- */
.header-btn {
  background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 1.2rem; transition: transform 0.2s;
}

.section-title { font-size: 1.1rem; font-weight: 800; margin: -5px 0 10px 5px; color: var(--text-main); }

.location-card { 
  padding: 20px 10px; border-radius: var(--radius); cursor: pointer; background: var(--bg-card); 
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
  gap: 12px; border: 1px solid var(--border-color); min-height: 180px; transition: transform 0.2s;
}
.location-card:hover { transform: translateY(-5px); }
.status-dot { width: 40px; height: 40px; border-radius: 50%; }

.my-shift-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }

.logistics-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 18px; margin-bottom: 15px; }
.logistics-box h4 { margin: 0 0 8px 0; font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; }

.filter-chip { padding: 8px 15px; border-radius: 20px; background: rgba(255,255,255,0.2); border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; font-weight: 600; }
.filter-chip.active { background: var(--primary-orange); color: white; }

.slot { padding: 18px; border-radius: 18px; margin-bottom: 10px; color: white; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.turno-M { background: var(--primary-orange); } .turno-T { background: var(--primary-blue); } .turno-TD { background: var(--primary-green); }

@media (max-width: 767px) {
  .app-wrapper { display: block; padding: 0; }
  .screen { height: 100vh; border-radius: 0; border: none; width: 100%; }
  #detail-screen { position: fixed; top: 0; left: 100%; width: 100%; z-index: 2000; transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  #detail-screen.active { left: 0; }
}

@media (min-width: 768px) {
  .app-wrapper { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
  #detail-screen { opacity: 1; }
}

#nameOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 9999; display: none; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="nameOverlay">
    <div style="background: var(--bg-screen); padding: 30px; border-radius: 28px; width: 90%; max-width: 400px; text-align: center;">
        <h2 style="margin-top:0;">Bienvenido</h2>
        <input type="text" id="userNameInput" placeholder="Escribe tu nombre..." style="width:100%; padding:16px; border-radius:15px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none; margin-bottom:15px;">
        <button onclick="saveName()" style="width:100%; padding:16px; border-radius:15px; border:none; background:var(--primary-orange); color:white; font-weight:bold; cursor:pointer;">Comenzar</button>
    </div>
  </div>

  <div class="app-wrapper">
    <section class="screen" id="list-screen">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:25px 25px 15px;">
        <h1 style="margin:0; font-size: 2.2rem;">Inicio</h1>
        <div style="display:flex; gap:12px;">
          <button class="header-btn" onclick="toggleTheme()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 A7 7 0 0 0 21 12.79z"/></svg></button>
        </div>
      </div>

      <div style="padding: 0 20px;"> 
        <input type="text" id="searchInput" placeholder="Buscar por nombre..." oninput="handleSearch()" style="width:100%; padding:14px 18px; border-radius:18px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none;">
      </div>

      <div class="scroll-container" id="locationsList" style="padding-top:10px;"></div>
    </section>

    <section class="screen" id="detail-screen">
      <div class="location-banner-container">
        <button onclick="goBack()" class="header-btn back-btn-floated">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <img id="locationBannerImg" src="" alt="Banner" class="location-banner-img">
        <div class="location-banner-overlay"></div>
      </div>

      <div class="scroll-container" id="detailScrollBody" style="margin-top: -40px; position: relative; z-index: 5;">
        <h1 id="currentPointTitle" style="margin:0 0 15px 0; font-size: 1.8rem;">Punto</h1>
        <div id="logisticsInfo"></div>
        <div id="daysRow" style="display:flex; gap:8px; margin: 20px 0; overflow-x:auto; padding-bottom: 5px;"></div>
        <div id="slotsContainer"></div>
      </div>
    </section>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT22dGTCsHGc5Qj4EbMxn4XqPoPuUI93UblvVlwu0nPm4FOUzMvLCIv5eTCgjQXS3MiNamBMsBdJ45A/pub?output=csv';
    
    // Añadimos URLs de imágenes para cada punto
    const POINT_DATA = {
      "Clínica Cordillera": { color: "#f36100", img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&q=80&w=800", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: "Av. Alejandro Fleming 7806" },
      "Supermercado Lider": { color: "#0056ff", img: "https://images.unsplash.com/photo-1534452285072-8bb1ef195c42?auto=format&fit=crop&q=80&w=800", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: "Av. Alejandro Fleming 7806" },
      "Santa Zita": { color: "#04c92f", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&q=80&w=800", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: "Incahuasi 1549" },
      "Visviri/Supermercado Santa Isabel": { color: "#f36100", img: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&q=80&w=800", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: "Espigas 1625" },
      "Feria de Francisco Bilbao (Curaco)": { color: "#0056ff", img: "https://images.unsplash.com/photo-1533900298318-6b8da08a523e?auto=format&fit=crop&q=80&w=800", days: ['Sabado'], guardado: "Duqueco 1965" },
      "Parque Intercomunal": { color: "#04c92f", img: "https://images.unsplash.com/photo-1585822797351-408f657929cf?auto=format&fit=crop&q=80&w=800", days: ['Domingo'], guardado: "Duqueco 1965" },
      "Patricia": { color: "#f36100", img: "https://images.unsplash.com/photo-1449034446853-66c86144b0ad?auto=format&fit=crop&q=80&w=800", days: ['Domingo'], guardado: "Incahuasi 1549" }
    };

    let allData = []; let currentDay = ''; let currentPoint = ""; let userName = localStorage.getItem('userName') || "";

    async function loadExcelData() {
      try {
        const res = await fetch(SHEET_URL); const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
        allData = rows.map((r, index) => {
          const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return { id: index, dia: (c[0]||"").trim(), tipo: (c[1]||"").replace(/"/g,"").toUpperCase(), nombres: (c[2]||"").replace(/"/g,""), hora: (c[3]||"").replace(/"/g,""), punto: (c[4]||"").replace(/"/g,"").trim() };
        });
        renderHome();
      } catch (e) { console.error(e); }
    }

    function saveName() { const i = document.getElementById('userNameInput'); if(i.value.trim()){ userName = i.value.trim(); localStorage.setItem('userName', userName); document.getElementById('nameOverlay').style.display = 'none'; renderHome(); } }

    function renderHome() {
        if(!userName) { document.getElementById('nameOverlay').style.display = 'flex'; return; }
        const home = document.getElementById('locationsList'); home.innerHTML = '';
        const myShifts = allData.filter(d => d.nombres.toLowerCase().includes(userName.toLowerCase()));
        
        if(myShifts.length > 0) {
            home.innerHTML += `<div class="section-title">Mis Turnos</div>`;
            myShifts.forEach(s => {
                const color = s.tipo.includes('TD') ? 'var(--primary-green)' : (s.tipo.startsWith('M') ? 'var(--primary-orange)' : 'var(--primary-blue)');
                home.innerHTML += `<div class="my-shift-card"><div style="display:flex; align-items:center; gap:10px;"><div style="width:10px; height:10px; border-radius:50%; background:${color};"></div><span style="font-weight:800;">${s.punto}</span></div><div style="color:var(--text-gray); font-size:0.85rem; padding-left:20px;">${s.dia} • ${s.hora}</div></div>`;
            });
        }
        
        home.innerHTML += `<div class="section-title">Locaciones</div><div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">${Object.keys(POINT_DATA).map(name => `<div class="location-card" onclick="selectPoint('${name}')"><div class="status-dot" style="background:${POINT_DATA[name].color}"></div><h2 style="font-size:0.9rem; margin:0;">${name}</h2></div>`).join('')}</div>`;
    }

    function selectPoint(name) {
      currentPoint = name; const p = POINT_DATA[name];
      
      // Actualizar Imagen
      const imgEl = document.getElementById('locationBannerImg');
      imgEl.src = p.img;
      
      document.getElementById('currentPointTitle').innerText = name;
      document.getElementById('logisticsInfo').innerHTML = `<div class="logistics-box"><h4>📍 Punto de Retiro</h4><p style="margin:0; font-weight:700;">${p.guardado}</p></div>`;
      
      const dRow = document.getElementById('daysRow'); dRow.innerHTML = ''; currentDay = p.days[0];
      p.days.forEach(d => {
        const b = document.createElement('div'); b.className = `filter-chip ${d === currentDay ? 'active' : ''}`; b.innerText = d.substring(0,3);
        b.onclick = () => { document.querySelectorAll('#daysRow .filter-chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentDay = d; renderShifts(); };
        dRow.appendChild(b);
      });
      
      if (window.innerWidth < 768) document.getElementById('detail-screen').classList.add('active');
      renderShifts();
    }

    function renderShifts() {
      const cont = document.getElementById('slotsContainer');
      const filtered = allData.filter(d => d.dia.toLowerCase() === currentDay.toLowerCase() && d.punto === currentPoint);
      cont.innerHTML = filtered.map(s => `<div class="slot ${s.tipo.includes('TD') ? 'turno-TD' : (s.tipo.startsWith('T') ? 'turno-T' : 'turno-M')}"><b>${s.nombres}</b><span style="font-size:0.85rem; opacity:0.9;">${s.hora}</span></div>`).join('') || '<p style="text-align:center; opacity:0.5;">No hay turnos para este día.</p>';
    }

    function goBack() { document.getElementById('detail-screen').classList.remove('active'); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    loadExcelData();
  </script>
</body>
</html>
