<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <style>
    :root {
      --bg-body: #f0f2f5;
      --bg-screen: #ffffff;
      --bg-card: #f8f9fa;
      --text-main: #1a1a1a;
      --text-gray: #65676b;
      --primary-orange: #f36100;
      --primary-blue: #0056ff;
      --primary-green: #28a745;
      --radius: 24px;
      --border-color: #e4e6eb;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
    }

    body.dark-mode {
      --bg-body: #1e1e1e;
      --bg-screen: #121212;
      --bg-card: #1e1e1e;
      --text-main: #ffffff;
      --text-gray: #a0a0a0;
      --border-color: rgba(255,255,255,0.05);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
    
    .app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; margin: auto; }
    .screen { background-color: var(--bg-screen); border-radius: var(--radius); overflow: hidden; height: 850px; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }
    .scroll-container { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }

    /* BOTONES HEADER CIRCULARES */
    .header-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: relative;
      transition: transform 0.2s;
    }
    .header-btn:active { transform: scale(0.9); }
    #updateBadge { position: absolute; top: 2px; right: 2px; width: 12px; height: 12px; background: #ff3b30; border-radius: 50%; border: 2px solid var(--bg-screen); display: none; }

    /* GRID 2x2 */
    .grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-items: stretch; }
    .location-card { 
      padding: 20px 10px; 
      border-radius: var(--radius); 
      cursor: pointer; 
      background-color: var(--bg-card); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
      gap: 12px; 
      border: 2px solid transparent; 
      min-height: 190px; 
      height: 100%; 
    }
    .status-dot { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
    .location-card h2 { margin: 0; font-size: 0.95rem; font-weight: 800; line-height: 1.2; }

    /* LOGÍSTICA */
    .logistics-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 15px; margin-bottom: 15px; }
    .logistics-box.orange { background: rgba(243, 97, 0, 0.05); border-color: rgba(243, 97, 0, 0.2); }
    .logistics-box h4 { margin: 0 0 8px 0; font-size: 0.7rem; text-transform: uppercase; color: var(--text-gray); letter-spacing: 0.5px; }
    .logistics-box.orange h4 { color: var(--primary-orange); }
    .logistics-box p { margin: 2px 0; font-weight: 700; font-size: 0.95rem; }
    .btn-mini { flex: 1; padding: 10px; border-radius: 12px; background: var(--bg-screen); border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.75rem; font-weight: 700; text-decoration: none; text-align: center; }

    /* BUSCADOR Y FILTROS */
    .search-input-container input { width: 100%; padding: 14px 50px 14px 18px; border-radius: 18px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); outline: none; }
    .filter-chip { padding: 8px 15px; border-radius: 20px; background: var(--bg-screen); border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; font-weight: 600; color: var(--text-gray); }
    .filter-chip.active { background: var(--primary-orange); color: white; border-color: var(--primary-orange); }

    /* TURNOS */
    .slot { padding: 20px; border-radius: var(--radius); margin-bottom: 12px; color: white; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform 0.2s; }
    .slot:active { transform: scale(0.98); }
    .turno-M { background-color: var(--primary-orange); }
    .turno-T { background-color: var(--primary-blue); }
    .turno-TD { background-color: var(--primary-green); }

    /* PANTALLAS MÓVIL Y DETALLE */
    @media (max-width: 767px) {
      .app-wrapper { display: block; padding: 0; }
      .screen { height: 100vh; border-radius: 0; border: none; width: 100%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
      #detail-screen { position: fixed; top: 0; left: 100%; width: 100%; z-index: 2000; }
      #detail-screen.active { transform: translateX(-100%); }
    }
    
    .turn-detail-screen { position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-screen); z-index: 4000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; }
    .turn-detail-screen.active { left: 0; }

    /* CHANGELOG */
    #changelogPanel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 350px; height: 100%; background: var(--bg-screen); z-index: 3000; transition: 0.4s; padding: 30px 25px; border-left: 1px solid var(--border-color); overflow-y: auto; }
    .changelog-item { background: var(--bg-card); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <section class="screen" id="list-screen">
      <div class="header-list" style="display:flex; justify-content:space-between; align-items:center; padding:30px 25px 15px;">
        <h1 style="margin:0; font-size: 2.2rem;">Inicio</h1>
        <div style="display:flex; gap:12px;">
          <button class="header-btn" onclick="toggleChangelog()">🚀<span id="updateBadge"></span></button>
          <button class="header-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
      </div>

      <div style="padding: 0 20px 15px;">
        <div style="position:relative; display:flex; align-items:center;">
          <input type="text" id="searchInput" placeholder="Buscar por nombre..." oninput="handleSearch()" style="width:100%; padding:14px 50px 14px 18px; border-radius:18px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none;">
          <button onclick="toggleFilterMenu()" style="position:absolute; right:10px; background:none; border:none; cursor:pointer; font-size:1.2rem;">O</button>
        </div>
        <div id="filterMenu" style="display:none; margin-top:10px; padding:15px; background:var(--bg-card); border-radius:15px;">
          <div class="title-for-filter"><h2>Selecciona de los filtros para buscar turnos</h2></div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <div class="filter-chip" onclick="toggleFilter('M')">Mañana</div>
            <div class="filter-chip" onclick="toggleFilter('T')">Tarde</div>
            <div class="filter-chip" onclick="toggleFilter('TD')">Disponibles</div>
          </div>
        </div>
      </div>

      <div class="scroll-container" id="locationsList"></div>
    </section>

    <section class="screen" id="detail-screen">
      <div style="padding: 20px 20px 0;">
        <button onclick="goBack()" style="background:var(--bg-card); border:1px solid var(--border-color); width:50px; height:50px; border-radius:50%; cursor:pointer; color:var(--text-main); font-size:1.4rem; display:flex; align-items:center; justify-content:center;">❮</button>
      </div>
      <div class="scroll-container" id="detailScrollBody">
        <h1 id="currentPointTitle" style="margin-top:10px; font-size: 1.8rem;">Punto</h1>
        <div id="logisticsInfo"></div>
        <div id="daysRow" style="display:flex; gap:8px; margin: 20px 0; overflow-x:auto;"></div>
        <div id="slotsContainer"></div>
      </div>
    </section>
  </div>

  <div id="turnDetailScreen" class="turn-detail-screen">
    <div style="padding: 25px; display: flex; align-items: center; gap: 15px;">
      <button onclick="closeTurnDetail()" style="background: var(--bg-card); border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--text-main);">✕</button>
      <h2 style="margin:0;">Ficha de Turno</h2>
    </div>
    <div class="scroll-container" id="turnDetailBody"></div>
    <div id="turnActionBar" style="padding:20px;"></div>
  </div>

  <div id="changelogPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
      <h2 style="margin:0;">Novedades</h2>
      <button onclick="toggleChangelog()" style="background:none; border:none; font-size: 2rem; cursor:pointer; color:var(--text-main);">✕</button>
    </div>
    <div id="changelogContent"></div>
  </div>

  <script>
    const APP_VERSION = "11.0.11";
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT22dGTCsHGc5Qj4EbMxn4XqPoPuUI93UblvVlwu0nPm4FOUzMvLCIv5eTCgjQXS3MiNamBMsBdJ45A/pub?output=csv';
    
    const POINT_DATA = {
      "Clínica Cordillera": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", sub: "Casa Eliana Whittaker", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } },
      "Supermercado Lider": { color: "#0056ff", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", sub: "Casa Eliana Whittaker", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } },
      "Santa Zita": { color: "#04c92f", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Incahuasi 1549", sub: "Familia Tobar", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } },
      "Visviri/Supermercado Santa Isabel": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Espigas 1625", sub: "Familia Muñoz", tel: "+56987274609" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } },
      "Feria de Francisco Bilbao (Curaco)": { color: "#0056ff", days: ['Sabado'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Parque Intercomunal": { color: "#04c92f", days: ['Domingo'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Patricia": { color: "#f36100", days: ['Domingo'], guardado: { nombre: "Incahuasi 1549", sub: "Familia Tobar", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } }
    };

    let allData = [];
    let currentDay = '';
    let currentPoint = "";
    let activeFilters = [];

    async function loadExcelData() {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
      allData = rows.map((r, index) => {
        const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        return { id: index, dia: (c[0]||"").trim(), tipo: (c[1]||"").replace(/"/g,"").toUpperCase(), nombres: (c[2]||"").replace(/"/g,""), hora: (c[3]||"").replace(/"/g,""), punto: (c[4]||"").replace(/"/g,"").trim() };
      });
    }

    function selectPoint(name) {
      currentPoint = name;
      const p = POINT_DATA[name];
      document.getElementById('currentPointTitle').innerText = name;
      document.getElementById('logisticsInfo').innerHTML = `
        <div class="logistics-box orange">
          <h4>📍 Retiro de Carrito</h4>
          <p>${p.guardado.nombre}</p>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <a href="tel:${p.guardado.tel}" class="btn-mini">📞 Llamar</a>
            <a href="http://maps.google.com/?q=${encodeURIComponent(p.guardado.nombre)}" target="_blank" class="btn-mini">🗺️ Mapa</a>
          </div>
        </div>
        <div class="logistics-box">
          <h4>👤 Encargado</h4>
          <p>${p.encargado.nombre}</p>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <a href="tel:${p.encargado.tel}" class="btn-mini">📞 Llamar</a>
          </div>
        </div>
      `;
      
      const dRow = document.getElementById('daysRow');
      dRow.innerHTML = '';
      currentDay = p.days[0];
      p.days.forEach(d => {
        const b = document.createElement('div');
        b.className = `filter-chip ${d === currentDay ? 'active' : ''}`;
        b.innerText = d.substring(0,3);
        b.onclick = () => { document.querySelectorAll('#daysRow .filter-chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentDay = d; renderShifts(); };
        dRow.appendChild(b);
      });

      if (window.innerWidth < 768) document.getElementById('detail-screen').classList.add('active');
      renderShifts();
    }

    function renderShifts() {
      const cont = document.getElementById('slotsContainer');
      const filtered = allData.filter(d => d.dia.toLowerCase() === currentDay.toLowerCase() && d.punto === currentPoint);
      cont.innerHTML = filtered.map(s => {
        const isTD = s.tipo.includes('TD');
        return `<div class="slot ${isTD ? 'turno-TD' : (s.tipo.startsWith('T') ? 'turno-T' : 'turno-M')}" onclick="openTurnDetail(${s.id})">
          <div style="display:flex; justify-content:space-between"><b>${s.nombres}</b><span>➔</span></div>
          <div style="background:rgba(255,255,255,0.2); padding:6px 14px; border-radius:999px; width:fit-content; font-size:0.9rem; font-weight:700;">${s.hora}</div>
        </div>`;
      }).join('') || '<p style="text-align:center; opacity:0.5; margin-top:20px;">No hay turnos hoy.</p>';
    }

    function openTurnDetail(id) {
      const s = allData.find(x => x.id === id);
      const p = POINT_DATA[s.punto] || POINT_DATA["Clínica Cordillera"];
      const isTD = s.tipo.includes('TD');
      document.getElementById('turnDetailBody').innerHTML = `
        <div style="background:var(--bg-card); border-radius:20px; padding:25px; margin-bottom:15px;">
           <span style="font-size:0.75rem; font-weight:800; color:${isTD?'var(--primary-green)':'var(--primary-blue)'}; border:1px solid; padding:4px 10px; border-radius:8px; text-transform:uppercase;">${isTD?'Disponible':'Ocupado'}</span>
           <h1 style="margin:12px 0 0; font-size:2.2rem; line-height:1.1;">${s.nombres}</h1>
        </div>
        <div style="padding:0 10px;">
          <div class="logistics-box"><h4>Horario</h4><p>${s.dia} • ${s.hora}</p></div>
          <div class="logistics-box"><h4>Punto de Retiro</h4><p>${p.guardado.nombre}</p><small>${p.guardado.sub}</small></div>
        </div>
      `;
      let btns = `<a href="http://maps.google.com/?q=${encodeURIComponent(s.punto + " Las Condes")}" target="_blank" style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); margin-bottom:12px; display:flex; padding:15px; border-radius:15px; justify-content:center; text-decoration:none; font-weight:bold;">📍 Cómo llegar al punto</a>`;
      if(isTD) btns += `<a href="https://wa.me/${p.encargado.tel.replace('+','')}" target="_blank" style="background:#25D366; color:white; padding:18px; border-radius:16px; font-weight:800; width:100%; display:flex; justify-content:center; text-decoration:none;">Solicitar este Turno</a>`;
      document.getElementById('turnActionBar').innerHTML = btns;
      document.getElementById('turnDetailScreen').classList.add('active');
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const home = document.getElementById('locationsList');
      if(!q && !activeFilters.length) { init(); return; }
      const res = allData.filter(r => {
        const mText = r.nombres.toLowerCase().includes(q);
        if(!activeFilters.length) return mText;
        return mText && activeFilters.some(f => f === 'TD' ? r.tipo.includes('TD') : (r.tipo.startsWith(f) && !r.tipo.includes('TD')));
      });
      home.innerHTML = `<div style="display:grid; gap:10px">${res.map(r => `<div class="logistics-box" onclick="openTurnDetail(${r.id})" style="cursor:pointer"><b>${r.nombres}</b><br><small>${r.punto} • ${r.dia}</small></div>`).join('')}</div>`;
    }

    function toggleFilterMenu() { const m = document.getElementById('filterMenu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; }
    function toggleFilter(f) { event.target.classList.toggle('active'); const i = activeFilters.indexOf(f); if(i>-1) activeFilters.splice(i,1); else activeFilters.push(f); handleSearch(); }
    function goBack() { document.getElementById('detail-screen').classList.remove('active'); }
    function closeTurnDetail() { document.getElementById('turnDetailScreen').classList.remove('active'); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); document.getElementById('themeBtn').innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙'; }
    function toggleChangelog() { const p = document.getElementById('changelogPanel'); p.style.right = p.style.right === '0px' ? '-100%' : '0px'; }
    
   function init() {
  // 1. CONFIGURA TU INFO AQUÍ (Fácil y limpio)
  const historial = [
    {
      version: "11.0.11-beta",
      cambios: [
        "RESTAURADO: Navegación a ficha de turno corregida.",
        "DISEÑO: Botones circulares estables.",
        "INFO: Aquí puedes añadir lo que tú quieras jajaja",
        "OTRO: Solo añade comas al final de cada frase"
      ]
    },
    // Si quieres otra versión abajo, copia desde { hasta }, y ponle una coma
  ];

  // 2. NO TOCAR NADA DE AQUÍ ABAJO (La maquinaria)
  const home = document.getElementById('locationsList');
  home.innerHTML = '<div class="grid-2x2" id="homeGrid"></div>';
  Object.keys(POINT_DATA).forEach(name => {
    const card = document.createElement('div');
    card.className = "location-card";
    card.onclick = () => selectPoint(name);
    card.innerHTML = `<div class="status-dot" style="background:${POINT_DATA[name].color}"></div><h2>${name}</h2>`;
    document.getElementById('homeGrid').appendChild(card);
  });
  
  loadExcelData();

  // Esto genera el diseño automáticamente usando tu info de arriba
  document.getElementById('changelogContent').innerHTML = historial.map(item => `
    <div class="changelog-item">
      <span style="background:var(--primary-orange); color:white; padding:2px 8px; border-radius:6px; font-size:0.7rem; font-weight:800;">${item.version}</span>
      <ul style="margin:10px 0; padding-left:20px; color:var(--text-gray); font-size:0.85rem">
        ${item.cambios.map(texto => `<li>${texto}</li>`).join('')}
      </ul>
    </div>
  `).join('');
}
    init();
  </script>
</body>
</html>
