<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="icon" href="favicon_io2/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io2/favicon-32x32.png">
  <link rel="apple-touch-icon" href="favicon_io2/apple-touch-icon.png">
  <style>
/* --- VARIABLES Y BASES --- */
:root {
  --bg-body: #f0f2f5; --bg-screen: #ffffff; --bg-card: #f8f9fa;
  --text-main: #1a1a1a; --text-gray: #65676b; --primary-orange: #f36100;
  --primary-blue: #0056ff; --primary-green: #28a745; --radius: 24px;
  --border-color: #e4e6eb; --shadow: 0 4px 12px rgba(0,0,0,0.08);
  /* Curva de rebote Apple (Spring) */
  --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
  --liquid-easing: cubic-bezier(0.22, 1, 0.36, 1);
}

body.dark-mode {
  --bg-body: #1e1e1e; --bg-screen: #121212; --bg-card: #1e1e1e;
  --text-main: #ffffff; --text-gray: #a0a0a0; --border-color: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
  margin: 0; font-family: 'Segoe UI', sans-serif; 
  background-color: var(--bg-body); color: var(--text-main); 
  overflow-x: hidden; 
  transition: background-color 0.4s ease;
}

/* --- ANIMACIONES DE ELASTICIDAD (BOUNCY) --- */
.screen, .logistics-box, .location-card, .filter-chip, .header-btn, .slot, .my-shift-card {
  transition: 
    transform 0.4s var(--spring-easing), 
    background-color 0.3s ease, 
    box-shadow 0.3s ease,
    opacity 0.3s ease;
}

/* Efecto de presión (Squish) */
.location-card:active, .slot:active, .my-shift-card:active, .header-btn:active, .filter-chip:active {
  transform: scale(0.92);
}

/* --- ESTRUCTURA --- */
.app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; margin: auto; }

.screen { 
  background-color: var(--bg-screen); border-radius: var(--radius); 
  overflow: hidden; height: 850px; display: flex; flex-direction: column; 
  box-shadow: var(--shadow); border: 1px solid var(--border-color); 
  position: relative; 
  backdrop-filter: blur(10px);
}

.scroll-container { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }

.header-btn {
  background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 1.1rem;
}

.grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

.location-card { 
  padding: 20px 10px; border-radius: var(--radius); cursor: pointer; background-color: var(--bg-card); 
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
  gap: 12px; border: 1px solid var(--border-color); min-height: 180px;
}

.status-dot { 
  width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0; 
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.location-card h2 { margin: 0; font-size: 0.95rem; font-weight: 800; line-height: 1.2; }

/* --- FILTROS Y BUSQUEDA --- */
#filterMenu {
  max-height: 0; opacity: 0; overflow: hidden; transform: scale(0.95) translateY(-10px);
  transition: all 0.4s var(--spring-easing);
}
#filterMenu.open { max-height: 300px; opacity: 1; transform: scale(1) translateY(0); }

.filter-chip { 
  padding: 8px 18px; border-radius: 20px; background: var(--bg-screen); 
  border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; 
  font-weight: 600; color: var(--text-gray); white-space: nowrap;
}
.filter-chip.active { 
  background: var(--primary-orange); color: white; border-color: var(--primary-orange);
  box-shadow: 0 4px 12px rgba(243, 97, 0, 0.3);
}

/* --- SLOTS Y CARDS --- */
.slot { 
  padding: 20px; border-radius: var(--radius); margin-bottom: 12px; 
  color: white; display: flex; flex-direction: column; gap: 10px; cursor: pointer;
}
.turno-M { background: linear-gradient(135deg, #f36100, #ff8c42); }
.turno-T { background: linear-gradient(135deg, #0056ff, #4d8aff); }
.turno-TD { background: linear-gradient(135deg, #28a745, #5ddb7b); }

.my-shift-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: 20px; padding: 16px; margin-bottom: 12px; cursor: pointer;
}

/* --- OVERLAYS (MODALES) --- */
#nameOverlay, #logoutOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(12px);
  z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

#nameModal, #logoutOverlay > div {
  background: var(--bg-screen); padding: 30px; border-radius: 28px;
  width: 100%; max-width: 400px; text-align: center;
  transform: scale(0.8); animation: modalPop 0.4s var(--spring-easing) forwards;
}

@keyframes modalPop { to { transform: scale(1); } }

/* --- DETALLE SCREEN (DESLIZAMIENTO) --- */
#detail-screen { 
  opacity: 0; transform: translateX(30px); 
  transition: transform 0.5s var(--liquid-easing), opacity 0.4s ease;
}
#detail-screen.active { opacity: 1; transform: translateX(0); }

@media (max-width: 767px) {
  .app-wrapper { display: block; padding: 0; }
  .screen { height: 100vh; border-radius: 0; border: none; width: 100%; }
  #detail-screen { 
    position: fixed; top: 0; left: 100%; width: 100%; z-index: 2000; 
    transform: translateX(0); transition: left 0.5s var(--liquid-easing);
  }
  #detail-screen.active { left: 0; }
}

@media (min-width: 768px) {
  .app-wrapper { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
  #detail-screen { opacity: 1; transform: none; }
}

/* Estilo Liquid Glass para inputs */
input {
  transition: all 0.3s var(--spring-easing);
}
input:focus {
  transform: scale(1.02);
  box-shadow: 0 0 0 4px rgba(243, 97, 0, 0.1);
}

.clear-filters-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(243, 97, 0, 0.1); color: var(--primary-orange);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s var(--spring-easing);
}
.clear-filters-btn:hover { transform: rotate(90deg) scale(1.1); }
  </style>
</head>
<body>

  <div id="nameOverlay">
    <div id="nameModal">
        <h2 style="margin-top:0;">Bienvenido</h2>
        <p style="color:var(--text-gray); margin-bottom:25px;">Introduce tu nombre para acceder.</p>
        <input type="text" id="userNameInput" placeholder="Escribe tu nombre..." 
               style="width:100%; padding:16px; border-radius:15px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none; font-size:1rem; margin-bottom:15px;">
        <button onclick="saveName()" 
                style="width:100%; padding:16px; border-radius:15px; border:none; background:var(--primary-orange); color:white; font-weight:bold; font-size:1rem; cursor:pointer;">
            Comenzar
        </button>
    </div>
  </div>

<div id="logoutOverlay">
  <div style="box-shadow: var(--shadow);">
      <div style="background: rgba(243, 97, 0, 0.1); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--primary-orange);">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </div>
      <h2 style="margin-top:0; font-size: 1.4rem;">¿Cerrar sesión?</h2>
      <p style="color:var(--text-gray); margin-bottom:25px; font-size: 0.95rem;">Tendrás que ingresar tu nombre nuevamente.</p>
      <div style="display:flex; gap:12px;">
        <button onclick="closeLogoutModal()" style="flex:1; padding:14px; border-radius:15px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); font-weight:bold; cursor:pointer;">Cancelar</button>
        <button onclick="confirmLogout()" style="flex:1; padding:14px; border-radius:15px; border:none; background:var(--primary-orange); color:white; font-weight:bold; cursor:pointer;">Sí, salir</button>
      </div>
  </div>
</div>

  <div class="app-wrapper">
    <section class="screen" id="list-screen">
      <div class="header-list" style="display:flex; justify-content:space-between; align-items:center; padding:25px 25px 10px;">
        <h1 style="margin:0; font-size: 2.2rem; letter-spacing: -1px;">Inicio</h1>
        <div style="display:flex; gap:12px;">
          <button class="header-btn" onclick="toggleTheme()"><svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 A7 7 0 0 0 21 12.79z"/></svg></button>
          <button class="header-btn" onclick="openLogoutModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>

      <div style="padding: 0 20px 5px;"> 
        <div style="position:relative; display:flex; align-items:center;">
          <input type="text" id="searchInput" placeholder="Buscar por nombre..." oninput="handleSearch()" style="width:100%; padding:14px 50px 14px 18px; border-radius:18px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none;">
          <button onclick="toggleFilterMenu()" style="position:absolute; right:12px; background:none; border:none; cursor:pointer; color:var(--text-gray);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="10" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="14" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="18" r="2"/></svg></button>
        </div>
        <div id="filterMenu" style="margin-top:10px; padding:5px 0;">
          <div style="display:flex; gap:8px; flex-wrap:nowrap; align-items:center; overflow-x: auto; padding-bottom: 5px;">
            <div class="filter-chip" onclick="toggleFilter('M')">Mañana</div>
            <div class="filter-chip" onclick="toggleFilter('T')">Tarde</div>
            <div class="filter-chip" onclick="toggleFilter('TD')">Disponibles</div>
            <div class="clear-filters-btn" onclick="clearFilters()">✕</div>
          </div>
        </div>
      </div>

      <div class="scroll-container" id="locationsList" style="padding-top: 10px;"></div>
    </section>

    <section class="screen" id="detail-screen">
      <div style="padding: 20px 20px 0;">
        <button onclick="goBack()" class="header-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>
      <div class="scroll-container" id="detailScrollBody">
        <h1 id="currentPointTitle" style="margin-top:10px; font-size: 1.8rem;">Punto</h1>
        <div id="logisticsInfo"></div>
        <div id="daysRow" style="display:flex; gap:8px; margin: 20px 0; overflow-x:auto; padding-bottom:10px;"></div>
        <div id="slotsContainer"></div>
      </div>
    </section>
  </div>

  <div id="turnDetailScreen" style="position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-screen); z-index: 4000; transition: transform 0.5s var(--liquid-easing); display: flex; flex-direction: column;">
    <div style="padding: 25px; display: flex; align-items: center; gap: 15px;">
      <button onclick="closeTurnDetail()" class="header-btn" style="border:none;">✕</button>
      <h2 style="margin:0;">Ficha de Turno</h2>
    </div>
    <div class="scroll-container" id="turnDetailBody"></div>
    <div id="turnActionBar" style="padding:20px;"></div>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT22dGTCsHGc5Qj4EbMxn4XqPoPuUI93UblvVlwu0nPm4FOUzMvLCIv5eTCgjQXS3MiNamBMsBdJ45A/pub?output=csv';
    
    const POINT_DATA = {
      "Clínica Cordillera": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", sub: "Casa Eliana Whittaker", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } },
      "Supermercado Lider": { color: "#0056ff", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", sub: "Casa Eliana Whittaker", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } },
      "Santa Zita": { color: "#04c92f", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Incahuasi 1549", sub: "Familia Tobar", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } },
      "Visviri/Supermercado Santa Isabel": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Espigas 1625", sub: "Familia Muñoz", tel: "+56987274609" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } },
      "Feria de Francisco Bilbao (Curaco)": { color: "#0056ff", days: ['Sabado'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Parque Intercomunal": { color: "#04c92f", days: ['Domingo'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Patricia": { color: "#f36100", days: ['Domingo'], guardado: { nombre: "Incahuasi 1549", sub: "Familia Tobar", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } }
    };

    let allData = [];
    let currentDay = '';
    let currentPoint = "";
    let activeFilters = [];
    let userName = localStorage.getItem('userName') || "";

    async function loadExcelData() {
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
        allData = rows.map((r, index) => {
          const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return { id: index, dia: (c[0]||"").trim(), tipo: (c[1]||"").replace(/"/g,"").toUpperCase(), nombres: (c[2]||"").replace(/"/g,""), hora: (c[3]||"").replace(/"/g,""), punto: (c[4]||"").replace(/"/g,"").trim() };
        });
        renderHome();
      } catch (e) { console.error("Error cargando datos", e); }
    }

    function saveName() {
        const input = document.getElementById('userNameInput');
        if(input.value.trim()){
            userName = input.value.trim();
            localStorage.setItem('userName', userName);
            document.getElementById('nameOverlay').style.display = 'none';
            renderHome();
        }
    }

    function openLogoutModal() { document.getElementById('logoutOverlay').style.display = 'flex'; }
    function closeLogoutModal() { document.getElementById('logoutOverlay').style.display = 'none'; }
    function confirmLogout() { localStorage.removeItem('userName'); location.reload(); }

    function renderHome() {
        if(!userName) {
            document.getElementById('nameOverlay').style.display = 'flex';
            return;
        }

        const home = document.getElementById('locationsList');
        home.innerHTML = '';

        const myShifts = allData.filter(d => d.nombres.toLowerCase().includes(userName.toLowerCase()));
        if(myShifts.length > 0) {
            home.innerHTML += `<div style="font-weight:800; margin: 10px 5px;">Mis Turnos</div>`;
            myShifts.forEach(s => {
                const color = s.tipo.includes('TD') ? 'var(--primary-green)' : (s.tipo.startsWith('M') ? 'var(--primary-orange)' : 'var(--primary-blue)');
                home.innerHTML += `
                    <div class="my-shift-card" onclick="openTurnDetail(${s.id})">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:12px; height:12px; border-radius:50%; background:${color};"></div>
                            <span style="font-weight:800; font-size:1.1rem;">${s.punto}</span>
                        </div>
                        <div style="color:var(--text-gray); font-size:0.9rem; font-weight:600; padding-left:22px;">
                            ${s.dia} • ${s.hora}
                        </div>
                    </div>
                `;
            });
        }

        home.innerHTML += `<div style="font-weight:800; margin: 20px 5px 10px;">Locaciones</div>`;
        const grid = document.createElement('div');
        grid.className = "grid-2x2";
        grid.innerHTML = Object.keys(POINT_DATA).map(name => `
            <div class="location-card" onclick="selectPoint('${name}')">
                <div class="status-dot" style="background:${POINT_DATA[name].color}"></div>
                <h2>${name}</h2>
            </div>
        `).join('');
        home.appendChild(grid);
    }

    function selectPoint(name) {
      currentPoint = name; const p = POINT_DATA[name];
      document.getElementById('currentPointTitle').innerText = name;
      document.getElementById('logisticsInfo').innerHTML = `<div class="logistics-box" style="background:rgba(243,97,0,0.05); border-color:rgba(243,97,0,0.1); padding:18px; border-radius:20px; margin-bottom:15px;">
        <h4 style="margin:0; font-size:0.7rem; color:var(--text-gray); text-transform:uppercase;">📍 Retiro</h4>
        <p style="margin:5px 0; font-weight:700;">${p.guardado.nombre}</p>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <a href="tel:${p.guardado.tel}" style="flex:1; background:white; text-decoration:none; text-align:center; padding:10px; border-radius:12px; font-size:0.8rem; font-weight:bold; color:var(--text-main); border:1px solid var(--border-color);">📞 Llamar</a>
        </div>
      </div>`;
      
      const dRow = document.getElementById('daysRow'); dRow.innerHTML = ''; currentDay = p.days[0];
      p.days.forEach(d => {
        const b = document.createElement('div'); b.className = `filter-chip ${d === currentDay ? 'active' : ''}`; b.innerText = d.substring(0,3);
        b.onclick = () => { 
          document.querySelectorAll('#daysRow .filter-chip').forEach(x=>x.classList.remove('active')); 
          b.classList.add('active'); currentDay = d; renderShifts(); 
        };
        dRow.appendChild(b);
      });
      document.getElementById('detail-screen').classList.add('active');
      renderShifts();
    }

    function renderShifts() {
      const cont = document.getElementById('slotsContainer');
      const filtered = allData.filter(d => d.dia.toLowerCase() === currentDay.toLowerCase() && d.punto === currentPoint);
      cont.innerHTML = filtered.map(s => {
        const isTD = s.tipo.includes('TD');
        return `<div class="slot ${isTD ? 'turno-TD' : (s.tipo.startsWith('T') ? 'turno-T' : 'turno-M')}" onclick="openTurnDetail(${s.id})">
          <div style="display:flex; justify-content:space-between"><b>${s.nombres}</b><span>➔</span></div>
          <div style="background:rgba(255,255,255,0.2); padding:6px 14px; border-radius:999px; width:fit-content; font-size:0.85rem; font-weight:700;">${s.hora}</div>
        </div>`;
      }).join('') || '<p style="text-align:center; opacity:0.5; margin-top:20px;">No hay turnos hoy.</p>';
    }

    function openTurnDetail(id) {
      const s = allData.find(x => x.id === id);
      const p = POINT_DATA[s.punto];
      if(!p) return;
      
      const isTD = s.tipo.includes('TD');
      const estadoColor = isTD ? 'var(--primary-green)' : 'var(--primary-blue)';
      
      document.getElementById('turnDetailBody').innerHTML = `
        <div style="background:var(--bg-card); border-radius:24px; padding:25px; margin-bottom:20px;">
          <span style="font-size:0.75rem; font-weight:800; color:${estadoColor}; border:1px solid ${estadoColor}; padding:4px 10px; border-radius:8px; display:inline-block; margin-bottom:15px;">${isTD?'Disponible':'Ocupado'}</span>
          <h1 style="margin:0; font-size:2rem;">${s.nombres}</h1>
          <h3 style="margin:5px 0; color:var(--text-gray);">${s.hora}</h3>
        </div>
        <div style="padding:0 5px;">
           <p style="font-weight:700;">👤 Encargado: ${p.encargado.nombre}</p>
           <a href="tel:${p.encargado.tel}" style="display:block; text-decoration:none; background:var(--bg-card); padding:15px; border-radius:15px; color:var(--text-main); font-weight:bold; border:1px solid var(--border-color); margin-bottom:10px;">📞 Llamar Encargado</a>
        </div>
      `;
      
      let btns = "";
      if (isTD) {
        btns = `<button onclick="window.open('https://wa.me/56996377733')" style="background:#25D366; color:white; border:none; padding:18px; border-radius:20px; font-weight:800; width:100%; font-size:1rem; cursor:pointer;">Solicitar este turno</button>`;
      }
      document.getElementById('turnActionBar').innerHTML = btns;
      document.getElementById('turnDetailScreen').style.transform = 'translateX(-100%)';
    }

    function closeTurnDetail() { document.getElementById('turnDetailScreen').style.transform = 'translateX(0)'; }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const home = document.getElementById('locationsList');
      if(!q && !activeFilters.length) { renderHome(); return; }
      
      let res = allData.filter(r => r.nombres.toLowerCase().includes(q));
      
      if(activeFilters.length > 0) {
        res = res.filter(r => {
          return activeFilters.some(filter => {
            if(filter === 'M') return r.tipo.startsWith('M');
            if(filter === 'T') return r.tipo.startsWith('T') && !r.tipo.includes('TD');
            if(filter === 'TD') return r.tipo.includes('TD');
            return false;
          });
        });
      }
      
      home.innerHTML = `<div style="display:grid; gap:10px">${res.map(r => {
        const isTD = r.tipo.includes('TD');
        const color = isTD ? 'var(--primary-green)' : (r.tipo.startsWith('M') ? 'var(--primary-orange)' : 'var(--primary-blue)');
        return `<div class="my-shift-card" onclick="openTurnDetail(${r.id})" style="display:flex; align-items:center; gap:14px;">
          <div style="width:14px; height:14px; border-radius:50%; background:${color}; flex-shrink:0;"></div>
          <div><div style="font-weight:800">${r.nombres}</div><div style="font-size:0.8rem; color:var(--text-gray)">${r.punto} • ${r.dia}</div></div>
        </div>`;
      }).join('')}</div>`;
    }

    function toggleFilterMenu() { document.getElementById('filterMenu').classList.toggle('open'); }
    
    function toggleFilter(f) { 
        event.target.classList.toggle('active'); 
        const i = activeFilters.indexOf(f); 
        if(i>-1) activeFilters.splice(i,1); else activeFilters.push(f); 
        handleSearch(); 
    }

    function clearFilters() {
        activeFilters = [];
        document.querySelectorAll('#filterMenu .filter-chip').forEach(chip => chip.classList.remove('active'));
        handleSearch();
    }

    function goBack() { document.getElementById('detail-screen').classList.remove('active'); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    loadExcelData();
  </script>
</body>
</html>
