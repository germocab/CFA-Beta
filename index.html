<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="icon" href="favicon_io2/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io2/favicon-32x32.png">
<link rel="apple-touch-icon" href="favicon_io2/apple-touch-icon.png">
  <style>
/* --- ESTILOS BASE --- */
body { transition: background-color 0.35s ease, color 0.35s ease; }
.screen, .logistics-box, .location-card, .filter-chip, .header-btn { transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease; }
.screen { transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease; }
#detail-screen { opacity: 0; }
#detail-screen.active { opacity: 1; }

#filterMenu {
  max-height: 0; opacity: 0; overflow: hidden; transform: translateY(-6px);
  transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.35s ease;
}
#filterMenu.open { max-height: 300px; opacity: 1; transform: translateY(0); }

:root {
  --bg-body: #f0f2f5; --bg-screen: #ffffff; --bg-card: #f8f9fa;
  --text-main: #1a1a1a; --text-gray: #65676b; --primary-orange: #f36100;
  --primary-blue: #0056ff; --primary-green: #28a745; --radius: 24px;
  --border-color: #e4e6eb; --shadow: 0 4px 12px rgba(0,0,0,0.08);
}

body.dark-mode {
  --bg-body: #1e1e1e; --bg-screen: #121212; --bg-card: #1e1e1e;
  --text-main: #ffffff; --text-gray: #a0a0a0; --border-color: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

.app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; margin: auto; }
.screen { background-color: var(--bg-screen); border-radius: var(--radius); overflow: hidden; height: 850px; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }

/* AJUSTE AGRESIVO DE ESPACIOS */
.scroll-container { 
    padding: 20px; 
    overflow-y: auto; 
    flex-grow: 1; 
    scroll-behavior: smooth; 
}

#locationsList {
    padding-top: 0px !important; /* Eliminamos el acolchado superior */
}

.section-title { 
    font-size: 1.1rem; 
    font-weight: 800; 
    margin: -5px 0 10px 5px; /* Margen negativo superior para subirlo */
    color: var(--text-main); 
}

/* ----------------------- */

.header-btn {
  background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 1.2rem; position: relative; transition: transform 0.2s;
}

.grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-items: stretch; }
.location-card { 
  padding: 20px 10px; border-radius: var(--radius); cursor: pointer; background-color: var(--bg-card); 
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
  gap: 12px; border: 2px solid transparent; min-height: 190px; height: 100%; 
}
.status-dot { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
.location-card h2 { margin: 0; font-size: 0.95rem; font-weight: 800; line-height: 1.2; }

.logistics-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 15px; margin-bottom: 15px; }

.filter-chip { padding: 8px 15px; border-radius: 20px; background: var(--bg-screen); border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; font-weight: 600; color: var(--text-gray); }
.filter-chip.active { background: var(--primary-orange); color: white; border-color: var(--primary-orange); }

.slot { padding: 20px; border-radius: var(--radius); margin-bottom: 12px; color: white; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform 0.2s; }
.turno-M { background-color: var(--primary-orange); }
.turno-T { background-color: var(--primary-blue); }
.turno-TD { background-color: var(--primary-green); }

#nameOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
}
#nameModal { background: var(--bg-screen); padding: 30px; border-radius: 28px; width: 100%; max-width: 400px; text-align: center; }

.my-shift-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
}

@media (max-width: 767px) {
  .app-wrapper { display: block; padding: 0; }
  .screen { height: 100vh; border-radius: 0; border: none; width: 100%; }
  #detail-screen { position: fixed; top: 0; left: 100%; width: 100%; z-index: 2000; }
  #detail-screen.active { transform: translateX(-100%); }
}

@media (min-width: 768px) {
  .app-wrapper { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
  #detail-screen { position: relative; opacity: 1 !important; transform: none !important; left: auto !important; }
}

/* ✨ LIQUID GLASS */
:root {
  --glass-blur: blur(18px); --glass-bg: rgba(255, 255, 255, 0.55); --glass-bg-dark: rgba(30, 30, 30, 0.55);
  --glass-border: rgba(255, 255, 255, 0.35); --glass-border-dark: rgba(255, 255, 255, 0.08); --glass-shadow: 0 10px 30px rgba(0,0,0,0.12);
}
body { background: radial-gradient(1200px 600px at 10% -10%, rgba(243,97,0,0.10), transparent), radial-gradient(900px 500px at 90% 110%, rgba(0,86,255,0.10), transparent), var(--bg-body); }
.screen, .location-card, .logistics-box, .my-shift-card, #filterMenu, #nameModal, #logoutOverlay > div { backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); background: var(--glass-bg); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
body.dark-mode .screen, body.dark-mode .location-card, body.dark-mode .logistics-box, body.dark-mode .my-shift-card, body.dark-mode #filterMenu, body.dark-mode #nameModal, body.dark-mode #logoutOverlay > div { background: var(--glass-bg-dark); border: 1px solid var(--glass-border-dark); }

#searchInput { backdrop-filter: blur(12px); background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.4); }
body.dark-mode #searchInput { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }

.clear-filters-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(243, 97, 0, 0.1); color: var(--primary-orange); display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 1.2rem; transition: all 0.2s ease; border: 1px solid rgba(243, 97, 0, 0.2); margin-left: 5px; }
    
  </style>
</head>
<body>

  <div id="nameOverlay">
    <div id="nameModal">
        <h2 style="margin-top:0;">Bienvenido</h2>
        <input type="text" id="userNameInput" placeholder="Escribe tu nombre..." style="width:100%; padding:16px; border-radius:15px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none; font-size:1rem; margin-bottom:15px;">
        <button onclick="saveName()" style="width:100%; padding:16px; border-radius:15px; border:none; background:var(--primary-orange); color:white; font-weight:bold; cursor:pointer;">Comenzar</button>
    </div>
  </div>

<div id="logoutOverlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 10000; display: none; align-items: center; justify-content: center; padding: 20px;">
  <div style="padding: 30px; border-radius: 28px; width: 100%; max-width: 350px; text-align: center;">
      <h2 style="margin-top:0;">¿Cerrar sesión?</h2>
      <div style="display:flex; gap:12px;">
        <button onclick="closeLogoutModal()" style="flex:1; padding:14px; border-radius:15px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); font-weight:bold; cursor:pointer;">Cancelar</button>
        <button onclick="confirmLogout()" style="flex:1; padding:14px; border-radius:15px; border:none; background:var(--primary-orange); color:white; font-weight:bold; cursor:pointer;">Sí, salir</button>
      </div>
  </div>
</div>

  <div class="app-wrapper">
    <section class="screen" id="list-screen">
      <div class="header-list" style="display:flex; justify-content:space-between; align-items:center; padding:25px 25px 15px;">
        <h1 style="margin:0; font-size: 2.2rem;">Inicio</h1>
        <div style="display:flex; gap:12px;">
          <button class="header-btn" onclick="toggleTheme()"><svg id="themeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 A7 7 0 0 0 21 12.79z"/></svg></button>
          <button class="header-btn" onclick="openLogoutModal()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </div>

      <div style="padding: 0 20px;"> 
        <div style="position:relative; display:flex; align-items:center;">
          <input type="text" id="searchInput" placeholder="Buscar por nombre..." oninput="handleSearch()" style="width:100%; padding:14px 50px 14px 18px; border-radius:18px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-main); outline:none;">
          <button onclick="toggleFilterMenu()" style="position:absolute; right:12px; background:none; border:none; cursor:pointer; color:var(--text-gray);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="10" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="14" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="8" cy="18" r="2"/></svg></button>
        </div>
        <div id="filterMenu" style="margin-top:10px; padding:15px; border-radius:15px;">
          <div style="display:flex; gap:8px; flex-wrap:nowrap; align-items:center; overflow-x: auto;">
            <div class="filter-chip" onclick="toggleFilter('M')">Mañana</div>
            <div class="filter-chip" onclick="toggleFilter('T')">Tarde</div>
            <div class="filter-chip" onclick="toggleFilter('TD')">Disponibles</div>
            <div class="clear-filters-btn" onclick="clearFilters()">✕</div>
          </div>
        </div>
      </div>

      <div class="scroll-container" id="locationsList"></div>

    </section>

    <section class="screen" id="detail-screen">
      <div style="padding: 20px 20px 0;">
        <button onclick="goBack()" class="header-btn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      </div>
      <div class="scroll-container" id="detailScrollBody">
        <h1 id="currentPointTitle" style="margin-top:10px; font-size: 1.8rem;">Punto</h1>
        <div id="logisticsInfo"></div>
        <div id="daysRow" style="display:flex; gap:8px; margin: 20px 0; overflow-x:auto;"></div>
        <div id="slotsContainer"></div>
      </div>
    </section>
  </div>

  <div id="turnDetailScreen" style="position: fixed; top: 0; left: 100%; width: 100%; height: 100%; background: var(--bg-screen); z-index: 4000; transition: 0.4s; display: flex; flex-direction: column;">
    <div style="padding: 25px; display: flex; align-items: center; gap: 15px;"><button onclick="closeTurnDetail()" style="background: var(--bg-card); border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; color: var(--text-main);">✕</button><h2 style="margin:0;">Ficha de Turno</h2></div>
    <div class="scroll-container" id="turnDetailBody"></div>
    <div id="turnActionBar" style="padding:20px;"></div>
  </div>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT22dGTCsHGc5Qj4EbMxn4XqPoPuUI93UblvVlwu0nPm4FOUzMvLCIv5eTCgjQXS3MiNamBMsBdJ45A/pub?output=csv';
    const POINT_DATA = { "Clínica Cordillera": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } }, "Supermercado Lider": { color: "#0056ff", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Av. Alejandro Fleming 7806", tel: "+56982195443" }, encargado: { nombre: "Douglas García", tel: "+56934574675" } }, "Santa Zita": { color: "#04c92f", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Incahuasi 1549", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } }, "Visviri/Supermercado Santa Isabel": { color: "#f36100", days: ['Lunes','Martes','Miercoles','Jueves','Viernes'], guardado: { nombre: "Espigas 1625", tel: "+56987274609" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } }, "Feria de Francisco Bilbao (Curaco)": { color: "#0056ff", days: ['Sabado'], guardado: { nombre: "Duqueco 1965", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } }, "Parque Intercomunal": { color: "#04c92f", days: ['Domingo'], guardado: { nombre: "Duqueco 1965", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } }, "Patricia": { color: "#f36100", days: ['Domingo'], guardado: { nombre: "Incahuasi 1549", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } } };
    let allData = []; let currentDay = ''; let currentPoint = ""; let activeFilters = []; let userName = localStorage.getItem('userName') || "";

    async function loadExcelData() {
      try {
        const res = await fetch(SHEET_URL); const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
        allData = rows.map((r, index) => {
          const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return { id: index, dia: (c[0]||"").trim(), tipo: (c[1]||"").replace(/"/g,"").toUpperCase(), nombres: (c[2]||"").replace(/"/g,""), hora: (c[3]||"").replace(/"/g,""), punto: (c[4]||"").replace(/"/g,"").trim() };
        });
        renderHome();
      } catch (e) { console.error(e); }
    }

    function saveName() { const i = document.getElementById('userNameInput'); if(i.value.trim()){ userName = i.value.trim(); localStorage.setItem('userName', userName); document.getElementById('nameOverlay').style.display = 'none'; renderHome(); } }
    function openLogoutModal() { document.getElementById('logoutOverlay').style.display = 'flex'; }
    function closeLogoutModal() { document.getElementById('logoutOverlay').style.display = 'none'; }
    function confirmLogout() { localStorage.removeItem('userName'); location.reload(); }

    function renderHome() {
        if(!userName) { document.getElementById('nameOverlay').style.display = 'flex'; return; }
        const home = document.getElementById('locationsList'); home.innerHTML = '';
        const myShifts = allData.filter(d => d.nombres.toLowerCase().includes(userName.toLowerCase()));
        if(myShifts.length > 0) {
            home.innerHTML += `<div class="section-title">Mis Turnos</div>`;
            myShifts.forEach(s => {
                const color = s.tipo.includes('TD') ? 'var(--primary-green)' : (s.tipo.startsWith('M') ? 'var(--primary-orange)' : 'var(--primary-blue)');
                home.innerHTML += `<div class="my-shift-card" onclick="openTurnDetail(${s.id})"><div style="display:flex; align-items:center; gap:10px;"><div style="width:12px; height:12px; border-radius:50%; background:${color};"></div><span style="font-weight:800;">${s.punto}</span></div><div style="color:var(--text-gray); font-size:0.9rem; padding-left:22px;">${s.dia} • ${s.hora}</div></div>`;
            });
        }
        home.innerHTML += `<div class="section-title">Locaciones</div><div class="grid-2x2">${Object.keys(POINT_DATA).map(name => `<div class="location-card" onclick="selectPoint('${name}')"><div class="status-dot" style="background:${POINT_DATA[name].color}"></div><h2>${name}</h2></div>`).join('')}</div>`;
    }

    function selectPoint(name) {
      currentPoint = name; const p = POINT_DATA[name];
      document.getElementById('currentPointTitle').innerText = name;
      document.getElementById('logisticsInfo').innerHTML = `<div class="logistics-box" style="border-left: 4px solid var(--primary-orange)"><h4>📍 Retiro</h4><p>${p.guardado.nombre}</p></div>`;
      const dRow = document.getElementById('daysRow'); dRow.innerHTML = ''; currentDay = p.days[0];
      p.days.forEach(d => {
        const b = document.createElement('div'); b.className = `filter-chip ${d === currentDay ? 'active' : ''}`; b.innerText = d.substring(0,3);
        b.onclick = () => { document.querySelectorAll('#daysRow .filter-chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentDay = d; renderShifts(); };
        dRow.appendChild(b);
      });
      if (window.innerWidth < 768) document.getElementById('detail-screen').classList.add('active');
      renderShifts();
    }

    function renderShifts() {
      const cont = document.getElementById('slotsContainer');
      const filtered = allData.filter(d => d.dia.toLowerCase() === currentDay.toLowerCase() && d.punto === currentPoint);
      cont.innerHTML = filtered.map(s => `<div class="slot ${s.tipo.includes('TD') ? 'turno-TD' : (s.tipo.startsWith('T') ? 'turno-T' : 'turno-M')}" onclick="openTurnDetail(${s.id})"><b>${s.nombres}</b><span>${s.hora}</span></div>`).join('') || '<p>No hay turnos.</p>';
    }

    function openTurnDetail(id) {
      const s = allData.find(x => x.id === id); const p = POINT_DATA[s.punto];
      document.getElementById('turnDetailBody').innerHTML = `<div style="padding:20px;"><h1>${s.nombres}</h1><p>${s.punto} - ${s.hora}</p></div>`;
      document.getElementById('turnDetailScreen').style.left = '0';
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const home = document.getElementById('locationsList');
      if(!q && !activeFilters.length) { renderHome(); return; }
      let res = allData.filter(r => r.nombres.toLowerCase().includes(q));
      home.innerHTML = `<div style="display:grid; gap:10px">${res.map(r => `<div class="logistics-box" onclick="openTurnDetail(${r.id})"><b>${r.nombres}</b><br>${r.punto}</div>`).join('')}</div>`;
    }

    function toggleFilterMenu() { document.getElementById('filterMenu').classList.toggle('open'); }
    function toggleFilter(f) { event.target.classList.toggle('active'); const i = activeFilters.indexOf(f); if(i>-1) activeFilters.splice(i,1); else activeFilters.push(f); handleSearch(); }
    function clearFilters() { activeFilters = []; document.querySelectorAll('#filterMenu .filter-chip').forEach(c => c.classList.remove('active')); handleSearch(); }
    function goBack() { document.getElementById('detail-screen').classList.remove('active'); }
    function closeTurnDetail() { document.getElementById('turnDetailScreen').style.left = '100%'; }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    loadExcelData();
  </script>
</body>
</html>
