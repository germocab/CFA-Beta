<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio</title>
  <link rel="icon" href="favicon_io2/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io2/favicon-32x32.png">
<link rel="apple-touch-icon" href="favicon_io2/apple-touch-icon.png">
  <style>
body {
  transition: background-color 0.35s ease, color 0.35s ease;
}

.screen, .logistics-box, .location-card, .filter-chip, .header-btn {
  transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
}

.screen { transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease; }
#detail-screen { opacity: 0; }
#detail-screen.active { opacity: 1; }

#filterMenu {
  max-height: 0; opacity: 0; overflow: hidden; transform: translateY(-6px);
  transition: max-height 0.35s ease, opacity 0.25s ease, transform 0.35s ease;
}
#filterMenu.open { max-height: 300px; opacity: 1; transform: translateY(0); }

:root {
  --bg-body: #f0f2f5; --bg-screen: #ffffff; --bg-card: #f8f9fa;
  --text-main: #1a1a1a; --text-gray: #65676b; --primary-orange: #f36100;
  --primary-blue: #0056ff; --primary-green: #28a745; --radius: 24px;
  --border-color: #e4e6eb; --shadow: 0 4px 12px rgba(0,0,0,0.08);
}

body.dark-mode {
  --bg-body: #1e1e1e; --bg-screen: #121212; --bg-card: #1e1e1e;
  --text-main: #ffffff; --text-gray: #a0a0a0; --border-color: rgba(255,255,255,0.05);
}

* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

.app-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 1100px; padding: 20px; margin: auto; }
.screen { background-color: var(--bg-screen); border-radius: var(--radius); overflow: hidden; height: 850px; display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border-color); position: relative; }
.scroll-container { padding: 20px; overflow-y: auto; flex-grow: 1; scroll-behavior: smooth; }

.header-btn {
  background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
  width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex;
  align-items: center; justify-content: center; font-size: 1.2rem; position: relative; transition: transform 0.2s;
}

.grid-2x2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-items: stretch; }
.location-card { 
  padding: 20px 10px; border-radius: var(--radius); cursor: pointer; background-color: var(--bg-card); 
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
  gap: 12px; border: 2px solid transparent; min-height: 190px; height: 100%; 
}
.status-dot { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
.location-card h2 { margin: 0; font-size: 0.95rem; font-weight: 800; line-height: 1.2; }

.logistics-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 15px; margin-bottom: 15px; }
.logistics-box.orange { background: rgba(243, 97, 0, 0.05); border-color: rgba(243, 97, 0, 0.2); }

.filter-chip { padding: 8px 15px; border-radius: 20px; background: var(--bg-screen); border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; font-weight: 600; color: var(--text-gray); }
.filter-chip.active { background: var(--primary-orange); color: white; border-color: var(--primary-orange); }

.slot { padding: 20px; border-radius: var(--radius); margin-bottom: 12px; color: white; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: transform 0.2s; }
.turno-M { background-color: var(--primary-orange); }
.turno-T { background-color: var(--primary-blue); }
.turno-TD { background-color: var(--primary-green); }

/* --- AJUSTES SOLICITADOS --- */
#nameOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
}
#nameModal {
    background: var(--bg-screen); padding: 30px; border-radius: 28px;
    width: 100%; max-width: 400px; text-align: center;
}

.section-title { 
    font-size: 1.1rem; 
    font-weight: 800; 
    margin: 10px 0 10px 5px; 
    color: var(--text-main); 
}

.my-shift-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
}

@media (max-width: 767px) {
  .app-wrapper { display: block; padding: 0; }
  .screen { height: 100vh; border-radius: 0; border: none; width: 100%; }
  #detail-screen { position: fixed; top: 0; left: 100%; width: 100%; z-index: 2000; }
  #detail-screen.active { transform: translateX(-100%); }

  /* Mobile: turn detail stays fullscreen */
  #turnDetailScreen {
    position: fixed !important;
    top: 0 !important;
    left: 100% !important;
    width: 100% !important;
    height: 100% !important;
    border-radius: 0 !important;
    max-width: none !important;
    max-height: none !important;
    transform: none !important;
    opacity: 1 !important;
    overflow: hidden !important;
  }
  #turnDetailScreen.open {
    left: 0 !important;
  }
  #turnDetailOverlay { display: none !important; }
}

@media (min-width: 768px) {
  .app-wrapper { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
  #detail-screen { position: relative; opacity: 1 !important; transform: none !important; left: auto !important; }

  /* Desktop: turn detail as modal popup */
  #turnDetailOverlay {
    display: flex;
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  #turnDetailOverlay.open {
    opacity: 1;
    pointer-events: all;
  }

  #turnDetailScreen {
    position: relative !important;
    top: auto !important;
    left: auto !important;
    width: 100% !important;
    max-width: 520px !important;
    height: auto !important;
    max-height: 85vh !important;
    border-radius: 28px !important;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3) !important;
    transform: scale(0.94) translateY(12px) !important;
    transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease !important;
    opacity: 0 !important;
    overflow: hidden !important;
    display: flex;
    flex-direction: column;
  }

  #turnDetailOverlay.open #turnDetailScreen {
    transform: scale(1) translateY(0) !important;
    opacity: 1 !important;
  }
}

#locationsList {
    flex: 1; 
    padding-bottom: 20px; 
    display: block;          
}

.logistics-box {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.logistics-box.orange {
    background: linear-gradient(145deg, rgba(243, 97, 0, 0.08), rgba(243, 97, 0, 0.02));
    border-color: rgba(243, 97, 0, 0.15);
}

.logistics-box h4 {
    margin: 0 0 8px 0;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-gray);
    display: flex;
    align-items: center;
    gap: 6px;
}

.logistics-box p {
    margin: 0;
    font-weight: 700;
    font-size: 1rem;
    color: var(--text-main);
}

.btn-mini {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.2s ease;
    border: 1px solid var(--border-color);
    background: var(--bg-screen);
    color: var(--text-main);
}

.btn-mini:active {
    transform: scale(0.96);
}

.logistics-box.orange .btn-mini {
    border-color: rgba(243, 97, 0, 0.2);
    color: var(--primary-orange);
}

/* ============================= */
/* LIQUID GLASS UPGRADE */
/* ============================= */

:root {
  --glass-blur: blur(18px);
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-dark: rgba(30, 30, 30, 0.55);
  --glass-border: rgba(255, 255, 255, 0.35);
  --glass-border-dark: rgba(255, 255, 255, 0.08);
  --glass-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

body {
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(243,97,0,0.10), transparent),
    radial-gradient(900px 500px at 90% 110%, rgba(0,86,255,0.10), transparent),
    var(--bg-body);
}

.screen,
.location-card,
.logistics-box,
.my-shift-card,
#filterMenu,
#nameModal,
#logoutOverlay > div {
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}

body.dark-mode .screen,
body.dark-mode .location-card,
body.dark-mode .logistics-box,
body.dark-mode .my-shift-card,
body.dark-mode #filterMenu,
body.dark-mode #nameModal,
body.dark-mode #logoutOverlay > div {
  background: var(--glass-bg-dark);
  border: 1px solid var(--glass-border-dark);
}

/* Apply glass to the turn detail modal on desktop */
@media (min-width: 768px) {
  #turnDetailScreen {
    backdrop-filter: blur(24px) !important;
    -webkit-backdrop-filter: blur(24px) !important;
    background: var(--glass-bg) !important;
    border: 1px solid var(--glass-border) !important;
  }
  body.dark-mode #turnDetailScreen {
    background: rgba(18, 18, 18, 0.85) !important;
    border: 1px solid var(--glass-border-dark) !important;
  }
}

.location-card,
.my-shift-card,
.slot,
.header-btn,
.btn-mini {
  transition:
    transform 0.25s cubic-bezier(.22,1,.36,1),
    box-shadow 0.25s ease,
    background 0.25s ease,
    border-color 0.25s ease;
}

.location-card:hover,
.my-shift-card:hover,
.slot:hover {
  transform: translateY(-4px) scale(1.01);
  box-shadow: 0 18px 40px rgba(0,0,0,0.14);
}

.header-btn:hover,
.btn-mini:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}

.filter-chip {
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.5);
}

body.dark-mode .filter-chip {
  background: rgba(255,255,255,0.06);
}

.filter-chip.active {
  box-shadow: 0 6px 18px rgba(243,97,0,0.35);
}

#searchInput {
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.6);
  border: 1px solid rgba(255,255,255,0.4);
  transition: all 0.25s ease;
}

body.dark-mode #searchInput {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
}

#searchInput:focus {
  box-shadow: 0 0 0 3px rgba(243,97,0,0.18);
  transform: translateY(-1px);
}

.status-dot {
  box-shadow: 0 0 0 6px rgba(255,255,255,0.25),
              0 8px 18px rgba(0,0,0,0.18);
}

#nameOverlay,
#logoutOverlay {
  backdrop-filter: blur(14px);
}

.screen {
  transition:
    transform 0.55s cubic-bezier(.22,1,.36,1),
    opacity 0.3s ease,
    background-color 0.35s ease,
    border-color 0.35s ease,
    box-shadow 0.35s ease;
}

.slot {
  position: relative;
  overflow: hidden;
}

.slot::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    transparent 20%,
    rgba(255,255,255,0.18),
    transparent 80%
  );
  opacity: 0;
  transition: opacity 0.25s ease;
}

.slot:hover::after {
  opacity: 1;
}

.edge-swipe-area {
  position: fixed;
  left: 0;
  top: 0;
  width: 24px;
  height: 100%;
  z-index: 5000;
  background: transparent;
}

html, body {
  overscroll-behavior-x: contain;
}

.screen,
#detail-screen,
#turnDetailScreen {
  touch-action: pan-y;
}

.clear-filters-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(243, 97, 0, 0.1);
  color: var(--primary-orange);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: bold;
  font-size: 1.2rem;
  transition: all 0.2s ease;
  border: 1px solid rgba(243, 97, 0, 0.2);
  margin-left: 5px;
}

.clear-filters-btn:hover {
  background: var(--primary-orange);
  color: white;
  transform: rotate(90deg);
}
    
  </style>

      "Feria de Francisco Bilbao (Curaco)": { color: "#0056ff", days: ['Sabado'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Parque Intercomunal": { color: "#04c92f", days: ['Domingo'], guardado: { nombre: "Duqueco 1965", sub: "Ingrid Arnold", tel: "+56977081786" }, encargado: { nombre: "Germán Cabezas", tel: "+56967883164" } },
      "Patricia": { color: "#f36100", days: ['Domingo'], guardado: { nombre: "Incahuasi 1549", sub: "Familia Tobar", tel: "+56992357751" }, encargado: { nombre: "Fernando Aldunate", tel: "+56996377733" } }
    };

    let allData = [];
    let currentDay = '';
    let currentPoint = "";
    let activeFilters = [];
    let userName = localStorage.getItem('userName') || "";

    const isDesktop = () => window.innerWidth >= 768;

    async function loadExcelData() {
      try {
        const res = await fetch(SHEET_URL);
        const text = await res.text();
        const rows = text.split(/\r?\n/).slice(1).filter(r => r.trim());
        allData = rows.map((r, index) => {
          const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          return { id: index, dia: (c[0]||"").trim(), tipo: (c[1]||"").replace(/"/g,"").toUpperCase(), nombres: (c[2]||"").replace(/"/g,""), hora: (c[3]||"").replace(/"/g,""), punto: (c[4]||"").replace(/"/g,"").trim() };
        });
        renderHome();
      } catch (e) { console.error("Error cargando datos", e); }
    }

    function saveName() {
        const input = document.getElementById('userNameInput');
        if(input.value.trim()){
            userName = input.value.trim();
            localStorage.setItem('userName', userName);
            document.getElementById('nameOverlay').style.display = 'none';
            renderHome();
        }
    }

    function openLogoutModal() { document.getElementById('logoutOverlay').style.display = 'flex'; }
    function closeLogoutModal() { document.getElementById('logoutOverlay').style.display = 'none'; }
    function confirmLogout() { localStorage.removeItem('userName'); location.reload(); }

    function renderHome() {
        if(!userName) {
            document.getElementById('nameOverlay').style.display = 'flex';
            return;
        }

        const home = document.getElementById('locationsList');
        home.innerHTML = '';

        const myShifts = allData.filter(d => d.nombres.toLowerCase().includes(userName.toLowerCase()));
        if(myShifts.length > 0) {
            home.innerHTML += `<div class="section-title">Mis Turnos</div>`;
            myShifts.forEach(s => {
                const color = s.tipo.includes('TD') ? 'var(--primary-green)' : (s.tipo.startsWith('M') ? 'var(--primary-orange)' : 'var(--primary-blue)');
                home.innerHTML += `
                    <div class="my-shift-card" onclick="openTurnDetail(${s.id})">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <div style="width:12px; height:12px; border-radius:50%; background:${color};"></div>
                            <span style="font-weight:800; font-size:1.1rem;">${s.punto}</span>
                        </div>
                        <div style="color:var(--text-gray); font-size:0.9rem; font-weight:600; padding-left:22px;">
                            ${s.dia} • ${s.hora}
                        </div>
                        <div style="background:var(--bg-screen); border-radius:12px; padding:10px; margin-top:4px; font-size:0.85rem; border:1px solid var(--border-color);">
                            <span style="color:var(--text-gray); font-weight:bold; display:block; margin-bottom:2px; font-size:0.7rem; text-transform:uppercase;">Turno de:</span>
                            <span style="font-weight:700;">${s.nombres}</span>
                        </div>
                    </div>
                `;
            });
        }

        home.innerHTML += `<div class="section-title">Locaciones</div>`;
        const grid = document.createElement('div');
        grid.className = "grid-2x2";
        grid.innerHTML = Object.keys(POINT_DATA).map(name => `
            <div class="location-card" onclick="selectPoint('${name}')">
                <div class="status-dot" style="background:${POINT_DATA[name].color}"></div>
                <h2>${name}</h2>
            </div>
        `).join('');
        home.appendChild(grid);
    }

    function selectPoint(name) {
      currentPoint = name; const p = POINT_DATA[name];
      document.getElementById('currentPointTitle').innerText = name;
      document.getElementById('logisticsInfo').innerHTML = `<div class="logistics-box orange"><h4>📍 Retiro</h4><p>${p.guardado.nombre}</p><div style="display:flex; gap:8px; margin-top:12px;"><a href="tel:${p.guardado.tel}" class="btn-mini">📞 Llamar</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.guardado.nombre)}" target="_blank" class="btn-mini">🗺️ Mapa</a></div></div><div class="logistics-box"><h4>👤 Encargado</h4><p>${p.encargado.nombre}</p><div style="display:flex; gap:8px; margin-top:12px;"><a href="tel:${p.encargado.tel}" class="btn-mini">📞 Llamar</a></div></div>`;
      const dRow = document.getElementById('daysRow'); dRow.innerHTML = ''; currentDay = p.days[0];
      p.days.forEach(d => {
        const b = document.createElement('div'); b.className = `filter-chip ${d === currentDay ? 'active' : ''}`; b.innerText = d.substring(0,3);
        b.onclick = () => { document.querySelectorAll('#daysRow .filter-chip').forEach(x=>x.classList.remove('active')); b.classList.add('active'); currentDay = d; renderShifts(); };
        dRow.appendChild(b);
      });
      if (window.innerWidth < 768) document.getElementById('detail-screen').classList.add('active');
      renderShifts();
    }

    function renderShifts() {
      const cont = document.getElementById('slotsContainer');
      const filtered = allData.filter(d => d.dia.toLowerCase() === currentDay.toLowerCase() && d.punto === currentPoint);
      cont.innerHTML = filtered.map(s => {
        const isTD = s.tipo.includes('TD');
        return `<div class="slot ${isTD ? 'turno-TD' : (s.tipo.startsWith('T') ? 'turno-T' : 'turno-M')}" onclick="openTurnDetail(${s.id})"><div style="display:flex; justify-content:space-between"><b>${s.nombres}</b><span>➔</span></div><div style="background:rgba(255,255,255,0.2); padding:6px 14px; border-radius:999px; width:fit-content; font-size:0.9rem; font-weight:700;">${s.hora}</div></div>`;
      }).join('') || '<p style="text-align:center; opacity:0.5; margin-top:20px;">No hay turnos hoy.</p>';
    }

    function openTurnDetail(id) {
      const s = allData.find(x => x.id === id); const p = POINT_DATA[s.punto];
      if(!p) return;
      const isTD = s.tipo.includes('TD'), isM = s.tipo.startsWith('M');
      const estadoColor = isTD ? 'var(--primary-green)' : 'var(--primary-blue)';
      document.getElementById('turnDetailBody').innerHTML = `<div style="background:var(--bg-card); border-radius:20px; padding:25px; margin-bottom:20px;"><div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;"><span style="width:fit-content; font-size:0.75rem; font-weight:800; color:${estadoColor}; border:1px solid ${estadoColor}; padding:4px 10px; border-radius:8px;">${isTD?'Disponible':'Ocupado'}</span><span style="font-size:0.85rem; color:var(--text-gray); font-weight:700;">⏰ ${isM?'Turno Mañana':'Turno Tarde'}</span></div><h1 style="margin:0;">${s.nombres}</h1><h3 style="margin:0;">${s.hora}</h3></div><div class="logistics-box orange"><h4>📍 Retiro</h4><p>${p.guardado.nombre}</p><div style="display:flex; gap:8px; margin-top:12px;"><a href="tel:${p.guardado.tel}" class="btn-mini">📞 Llamar</a><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.guardado.nombre)}" target="_blank" class="btn-mini">🗺️ Mapa</a></div></div><div class="logistics-box"><h4>👤 Encargado</h4><p>${p.encargado.nombre}</p><div style="display:flex; gap:8px; margin-top:12px;"><a href="https://wa.me/${p.encargado.tel.replace('+','')}" target="_blank" class="btn-mini">💬 WhatsApp</a><a href="tel:${p.encargado.tel}" class="btn-mini">📞 Llamar</a></div></div>`;
      let btns = `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.punto)}" target="_blank" style="background:var(--bg-card); color:var(--text-main); border:1px solid var(--border-color); margin-bottom:12px; display:flex; padding:15px; border-radius:15px; justify-content:center; text-decoration:none; font-weight:bold;">📍 Cómo llegar</a>`;
      if (isTD) {
        const mensaje = `Hola! Quiero inscribirme en el turno disponible:\n*Punto*: ${s.punto}\n*Día*: ${s.dia}\n*Hora*: ${s.hora}\n*Nombre*: ${userName}`;
        btns += `<a href="https://api.whatsapp.com/send?phone=56996377733&text=${encodeURIComponent(mensaje)}" target="_blank" style="background:#25D366; color:white; padding:18px; border-radius:16px; font-weight:800; width:100%; display:flex; justify-content:center; text-decoration:none;">Solicitar Turno</a>`;
      }      
      document.getElementById('turnActionBar').innerHTML = btns;

      if (isDesktop()) {
        // Desktop: show as popup modal
        const overlay = document.getElementById('turnDetailOverlay');
        overlay.style.display = 'flex';
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            overlay.classList.add('open');
          });
        });
        document.body.style.overflow = 'hidden';
      } else {
        // Mobile: slide in fullscreen
        document.getElementById('turnDetailScreen').classList.add('open');
      }
    }

    function handleOverlayClick(e) {
      // Close if clicking on the overlay background (not the modal itself)
      if (e.target === document.getElementById('turnDetailOverlay')) {
        closeTurnDetail();
      }
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const home = document.getElementById('locationsList');
      if(!q && !activeFilters.length) { renderHome(); return; }
      
      let res = allData.filter(r => r.nombres.toLowerCase().includes(q));
      
      if(activeFilters.length > 0) {
        res = res.filter(r => {
          return activeFilters.some(filter => {
            if(filter === 'M') return r.tipo.startsWith('M');
            if(filter === 'T') return r.tipo.startsWith('T') && !r.tipo.includes('TD');
            if(filter === 'TD') return r.tipo.includes('TD');
            return false;
          });
        });
      }
      
      home.innerHTML = `<div style="display:grid; gap:10px">${res.map(r => {
        const isTD = r.tipo.includes('TD');
        const isM = r.tipo.startsWith('M');
        const color = isTD ? 'var(--primary-green)' : (isM ? 'var(--primary-orange)' : 'var(--primary-blue)');
        return `<div class="logistics-box" onclick="openTurnDetail(${r.id})" style="cursor:pointer; display:flex; align-items:center; gap:14px;"><div style="width:14px; height:14px; border-radius:50%; background:${color}; flex-shrink:0;"></div><div><div style="font-weight:800">${r.nombres}</div><div style="font-size:0.8rem; color:var(--text-gray)">${r.punto} • ${r.dia}</div></div></div>`;
      }).join('')}</div>`;
    }

    function toggleFilterMenu() { document.getElementById('filterMenu').classList.toggle('open'); }
    
    function toggleFilter(f) { 
        const chip = event.target;
        chip.classList.toggle('active'); 
        const i = activeFilters.indexOf(f); 
        if(i>-1) activeFilters.splice(i,1); else activeFilters.push(f); 
        handleSearch(); 
    }

    function clearFilters() {
        activeFilters = [];
        const chips = document.querySelectorAll('#filterMenu .filter-chip');
        chips.forEach(chip => chip.classList.remove('active'));
        handleSearch();
    }

    function goBack() { document.getElementById('detail-screen').classList.remove('active'); }
    
    function closeTurnDetail() {
      if (isDesktop()) {
        const overlay = document.getElementById('turnDetailOverlay');
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 300);
      } else {
        document.getElementById('turnDetailScreen').classList.remove('open');
      }
    }

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeTurnDetail();
    });

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    loadExcelData();
  </script>
</body>
</html>
