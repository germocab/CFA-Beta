<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio - CFA Beta</title>
  <style>
    :root {
      --primary-dark: #1a4340; /* Verde oscuro del header */
      --bg-body: #f8f9fa;
      --text-main: #1a1a1a;
      --text-gray: #65676b;
      --primary-orange: #f36100;
      --primary-green: #00c853;
      --primary-blue: #0056ff;
      --radius-lg: 28px;
      --radius-md: 20px;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    body.dark-mode {
      --bg-body: #121212;
      --text-main: #ffffff;
      --text-gray: #a0a0a0;
      --primary-dark: #0d2624;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

    /* --- WRAPPER Y HEADER --- */
    .app-wrapper { max-width: 450px; margin: auto; min-height: 100vh; background: var(--bg-body); position: relative; }
    
    .header-bg {
      background-color: var(--primary-dark);
      height: 220px;
      padding: 40px 25px;
      border-radius: 0 0 30px 30px;
      color: white;
      position: relative;
    }

    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    .header-top h1 { margin: 0; font-size: 2rem; font-weight: 700; }

    /* --- PRÓXIMO TURNO CARD --- */
    .next-shift-card {
      background: white;
      border-radius: var(--radius-md);
      padding: 20px;
      color: #333;
      box-shadow: var(--shadow);
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: -60px;
      z-index: 10;
    }

    body.dark-mode .next-shift-card { background: #1e1e1e; color: white; }

    .next-shift-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    .next-shift-title { font-size: 1rem; font-weight: 800; color: #1a4340; margin-bottom: 12px; }
    body.dark-mode .next-shift-title { color: #4ade80; }

    .next-shift-footer { display: flex; justify-content: space-between; align-items: center; }
    .user-info { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; font-weight: 600; color: var(--text-gray); }
    .user-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .time-badge { background: var(--primary-green); color: white; padding: 6px 15px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }

    /* --- SECCIONES DE LOCACIONES --- */
    .content-area { padding: 80px 20px 20px; }
    .section-group { margin-bottom: 30px; }
    .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; color: #2c3e50; }
    body.dark-mode .section-title { color: white; }

    /* Carrousel Horizontal */
    .horizontal-scroll {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }

    .location-card-img {
      min-width: 200px;
      height: 180px;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .location-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .location-card-img:hover img { transform: scale(1.1); }

    .location-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(0,0,0,0.8));
      display: flex;
      align-items: flex-end;
      padding: 15px;
    }

    .location-overlay h3 { color: white; margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.2; }

    /* --- MENÚ DESPLEGABLE --- */
    .menu-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropdown-menu {
      position: absolute;
      top: 90px;
      right: 20px;
      background: white;
      border-radius: 20px;
      width: 180px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      z-index: 100;
      overflow: hidden;
    }

    .dropdown-menu.active { display: flex; }
    .menu-item {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      color: #333;
      transition: background 0.2s;
    }
    .menu-item:hover { background: #f0f2f5; }
    .menu-item.logout { color: #ff3b30; }

    /* --- OTROS --- */
    #nameOverlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .modal { background: white; padding: 30px; border-radius: var(--radius-lg); width: 90%; max-width: 350px; text-align: center; }
  </style>
</head>
<body class="">

  <div id="nameOverlay">
    <div class="modal">
      <h2>Bienvenido</h2>
      <p style="color:var(--text-gray)">Ingresa tu nombre para continuar</p>
      <input type="text" id="userNameInput" placeholder="Tu nombre" style="width:100%; padding:15px; border-radius:15px; border:1px solid #ddd; margin: 20px 0;">
      <button onclick="saveName()" style="width:100%; padding:15px; border-radius:15px; background:var(--primary-dark); color:white; border:none; font-weight:700;">Entrar</button>
    </div>
  </div>

  <div class="app-wrapper">
    <header class="header-bg">
      <div class="header-top">
        <h1>Inicio</h1>
        <button class="menu-btn" onclick="toggleMenu()">
          <svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16"><path d="M9.5 13a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm0-5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/></svg>
        </button>
      </div>

      <div id="mainMenu" class="dropdown-menu">
        <div class="menu-item" onclick="toggleTheme()">
          <span>🌙 Modo Oscuro</span>
        </div>
        <div class="menu-item logout" onclick="logout()">
          <span>🚪 Cerrar Sesión</span>
        </div>
      </div>

      <div class="next-shift-card" id="nextShiftCard">
        <div class="next-shift-header">
          <span>Próximo Turno</span>
          <span id="nextDay">JUEVES</span>
        </div>
        <div class="next-shift-title" id="nextPoint">SUPERMERCADO LÍDER</div>
        <div class="next-shift-footer">
          <div class="user-info">
            <img src="https://i.pravatar.cc/100?u=nicolas" class="user-avatar" alt="User">
            <span id="currentUserNameDisplay">con Nicolás Muñoz</span>
          </div>
          <div class="time-badge" id="nextTime">08:00 - 9:00</div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <div class="section-group">
        <div class="section-title">Entre semana</div>
        <div class="horizontal-scroll" id="weekList">
          </div>
      </div>

      <div class="section-group">
        <div class="section-title">Fin de Semana</div>
        <div class="horizontal-scroll" id="weekendList">
          </div>
      </div>
    </main>
  </div>

  <script>
    const POINT_DATA = {
      "Clínica Cordillera": { img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=400&q=80", type: "week" },
      "Supermercado Lider": { img: "https://images.unsplash.com/photo-1534723452862-4c874018d66d?auto=format&fit=crop&w=400&q=80", type: "week" },
      "Santa Zita": { img: "https://images.unsplash.com/photo-1449156003053-96421817dea5?auto=format&fit=crop&w=400&q=80", type: "week" },
      "Feria de Patricia": { img: "https://images.unsplash.com/photo-1488459711616-2474c31d2fc5?auto=format&fit=crop&w=400&q=80", type: "weekend" },
      "Parque Intercomunal": { img: "https://images.unsplash.com/photo-1588714477688-cf28a50e94f7?auto=format&fit=crop&w=400&q=80", type: "weekend" }
    };

    let userName = localStorage.getItem('userName');

    function checkUser() {
      if (!userName) {
        document.getElementById('nameOverlay').style.display = 'flex';
      } else {
        document.getElementById('currentUserNameDisplay').innerText = `con ${userName}`;
        renderLocations();
      }
    }

    function saveName() {
      const name = document.getElementById('userNameInput').value.trim();
      if (name) {
        localStorage.setItem('userName', name);
        userName = name;
        document.getElementById('nameOverlay').style.display = 'none';
        location.reload();
      }
    }

    function toggleMenu() {
      document.getElementById('mainMenu').classList.toggle('active');
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      toggleMenu();
    }

    function logout() {
      localStorage.removeItem('userName');
      location.reload();
    }

    function renderLocations() {
      const weekList = document.getElementById('weekList');
      const weekendList = document.getElementById('weekendList');
      
      Object.keys(POINT_DATA).forEach(name => {
        const data = POINT_DATA[name];
        const card = `
          <div class="location-card-img" onclick="console.log('Click en ${name}')">
            <img src="${data.img}" alt="${name}">
            <div class="location-overlay">
              <h3>${name}</h3>
            </div>
          </div>
        `;
        
        if (data.type === "week") weekList.innerHTML += card;
        else weekendList.innerHTML += card;
      });
    }

    // Cerrar menú si se hace click fuera
    window.onclick = function(event) {
      if (!event.target.closest('.menu-btn')) {
        document.getElementById('mainMenu').classList.remove('active');
      }
    }

    checkUser();
  </script>
</body>
</html>
